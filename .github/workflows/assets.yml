name: Upload artefacts

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Upload via SFTP
      env:
        SFTP_USER: ${{ secrets.SFTP_USER }}
        SFTP_SSH_KEY: ${{ secrets.SFTP_SSH_KEY }}
        SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
      run: |
        umask 077
        printf '%s\n' "$SFTP_SSH_KEY" > "$RUNNER_TEMP/key"
        printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
        cd src/Resources/Published
        sftp -b - -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes \
          -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
          "$SFTP_USER@lostartefacts.dev" <<EOF
        cd pub
        put tr1-assets.zip
        put tr2-assets.zip
        put tr3-assets.zip
        put tr4-assets.zip
        bye
        EOF
